<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">BYL0KE — Developer &amp; Digital Creator</title>
  <desc id="desc">Portada oscura de estilo tecnológico con brillo animado morado y cian</desc>
  <defs>
    <linearGradient id="back" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#070b17"/><stop offset=".58" stop-color="#14102f"/><stop offset="1" stop-color="#071827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b76df8"/><stop offset=".55" stop-color="#7b72fa"/><stop offset="1" stop-color="#40d4ed"/></linearGradient>
    <linearGradient id="moving" x1="0" x2="1"><stop offset="0" stop-color="#5e44d6" stop-opacity="0"/><stop offset=".5" stop-color="#c68dff" stop-opacity=".28"/><stop offset="1" stop-color="#40d4ed" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#a6a2ff" stroke-opacity=".085" stroke-width=".7"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="23"/></filter>
    <clipPath id="round"><rect width="1200" height="350" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="350" fill="url(#back)"/>
    <rect width="1200" height="350" fill="url(#grid)"/>
    <circle cx="160" cy="290" r="180" fill="#802ef2" opacity=".14" filter="url(#glow)">
      <animate attributeName="cx" values="160;240;160" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="40" r="190" fill="#00c8ed" opacity=".12" filter="url(#glow)">
      <animate attributeName="cy" values="40;120;40" dur="11s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(1010 165)" opacity=".31" stroke="url(#accent)" fill="none">
      <circle r="97" stroke-width="1.3" stroke-dasharray="7 14">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="45s" repeatCount="indefinite"/>
      </circle>
      <circle r="70" stroke-width="1" stroke-dasharray="35 13"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="30s" repeatCount="indefinite"/></circle>
      <path d="M-40 0H40M0 -40V40" stroke-opacity=".5"/>
      <circle r="5" fill="#52d6ea" stroke="none"/>
    </g>
    <g fill="none" stroke="url(#accent)" stroke-opacity=".36" stroke-width="2">
      <path d="M0 62H145L188 105H360"/>
      <path d="M1200 270H1028L990 232H900"/>
    </g>
    <rect x="53" y="46" width="4" height="258" rx="2" fill="url(#accent)"/>
    <g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
      <text x="88" y="115" font-size="15" font-weight="700" fill="#93a5c4" letter-spacing="5">CREATIVE ENGINEERING / DIGITAL PRODUCTS</text>
      <text x="83" y="224" font-size="106" font-weight="800" fill="#f8f7ff" letter-spacing="-6">BYL0KE</text>
      <rect x="88" y="244" width="385" height="3" rx="2" fill="url(#accent)"/>
      <text x="89" y="283" font-size="19" font-weight="500" fill="#c4cce3" letter-spacing="1.2">DEVELOPER  •  BUILDER  •  CREATOR</text>
      <text x="90" y="318" font-size="12" fill="#8d9dbb" letter-spacing="1.6">WEB · FIVEM · AUTOMATION · DIGITAL BRANDS</text>
    </g>
    <rect x="-310" y="0" width="280" height="350" fill="url(#moving)" transform="skewX(-20)">
      <animate attributeName="x" values="-310;1580" dur="7s" repeatCount="indefinite"/>
    </rect>
    <path d="M0 348H1200" stroke="url(#accent)" stroke-width="4"/>
  </g>
</svg>