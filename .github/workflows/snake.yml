name: Generate contribution snake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
  schedule:
    - cron: '19 5 * * *'

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate dark and light SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Byl0ke
          outputs: |
            dist/github-snake.svg?color_snake=%23b99145&color_dots=%23f4f1e8,%23ecdcb5,%23d9bb78,%23b8944c,%23816029
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23F0D28A&color_dots=%230c0d0e,%2327211a,%2354462a,%238b6b34,%23D9B567

      - name: Publish generated animations to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: update contribution animations'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
